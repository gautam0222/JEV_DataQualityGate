[project]
name = "jev-data-quality-gate"
version = "0.1.0"
description = "A small, explainable data-quality gate for retail batches."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "openpyxl>=3.1,<4.0",
    "pandas>=2.1,<3.0",
    "pytest>=8.4.2",
    "typesafe-sdk>=0.7.1,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
